<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SomaFitX | Tienda Oficial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SDK Oficial de Mercado Pago -->
    <script src="https://sdk.mercadopago.com/js/v2"></script>

    <style>
        :root {
            --bg-dark: #07060D;
            --bg-card: #0F0D1B;
            --purple-neon: #A000FF;
            --purple-glow: rgba(160, 0, 255, 0.4);
            --blue-neon: #00E5FF;
            --blue-glow: rgba(0, 229, 255, 0.4);
            --red-neon: #FF1744;
            --red-glow: rgba(255, 23, 68, 0.5);
            --text-light: #F0F4F8;
            --text-muted: #A0A5BA;
            --border-glow: #1A162B;
            --mp-blue: #009EE3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
        }

        /* HEADER & NAVBAR */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(7, 6, 13, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(160, 0, 255, 0.2);
            z-index: 1000;
            padding: 12px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-img {
            height: 48px;
            width: auto;
            border-radius: 50%;
            box-shadow: 0 0 10px var(--purple-glow), 0 0 10px var(--blue-glow);
            border: 1px solid var(--blue-neon);
        }

        .logo-text {
            font-size: 1.6rem;
            font-weight: 900;
            font-style: italic;
            background: linear-gradient(135deg, #FFF 30%, var(--blue-neon) 70%, var(--purple-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 18px;
            flex-wrap: wrap;
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            cursor: pointer;
        }

        nav a:hover, nav a.active {
            color: var(--blue-neon);
            text-shadow: 0 0 8px var(--blue-glow);
        }

        .cart-icon-btn {
            position: relative;
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 1.5rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .cart-icon-btn:hover {
            color: var(--blue-neon);
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -10px;
            background: var(--red-neon);
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px var(--red-glow);
        }

        /* HERO SECTION */
        .hero {
            margin-top: 85px;
            padding: 50px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
            min-height: 70vh;
            background: radial-gradient(circle at 20% 50%, rgba(160, 0, 255, 0.15), transparent 50%),
                        radial-gradient(circle at 80% 50%, rgba(0, 229, 255, 0.15), transparent 50%);
        }

        .hero-content {
            max-width: 550px;
        }

        .hero-tag {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid var(--blue-neon);
            color: var(--blue-neon);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            text-shadow: 0 0 5px var(--blue-glow);
        }

        .hero-title {
            font-size: 3.2rem;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .hero-title span.purple {
            color: var(--purple-neon);
            text-shadow: 0 0 15px var(--purple-glow);
        }

        .hero-title span.blue {
            color: var(--blue-neon);
            text-shadow: 0 0 15px var(--blue-glow);
        }

        .slogan-bar {
            display: flex;
            gap: 15px;
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--text-light);
            margin-bottom: 30px;
            border-left: 3px solid var(--purple-neon);
            padding-left: 15px;
        }

        .btn-primary {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, var(--purple-neon), var(--blue-neon));
            color: #fff;
            text-decoration: none;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 6px;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(160, 0, 255, 0.4);
            transition: 0.3s;
        }

        .hero-image-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-logo-hero {
            max-width: 100%;
            max-height: 420px;
            border-radius: 20px;
            box-shadow: 0 0 35px var(--purple-glow), 0 0 35px var(--blue-glow);
            border: 2px solid rgba(0, 229, 255, 0.3);
        }

        /* BARRA DE FILTROS */
        .category-nav-bar {
            padding: 20px 5%;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            background: #0B0A14;
        }

        .cat-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            color: var(--text-light);
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .cat-btn:hover, .cat-btn.active {
            background: linear-gradient(135deg, var(--purple-neon), var(--blue-neon));
            border-color: var(--blue-neon);
            color: #fff;
        }

        /* PRODUCTOS */
        .products-section {
            padding: 50px 5% 80px 5%;
            max-width: 1300px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
        }

        .grid-products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 20px;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            border-color: var(--blue-neon);
            box-shadow: 0 0 20px var(--blue-glow);
            transform: translateY(-5px);
        }

        .product-card.featured {
            border-color: var(--red-neon);
            box-shadow: 0 0 25px var(--red-glow);
            background: linear-gradient(180deg, rgba(255, 23, 68, 0.08) 0%, var(--bg-card) 100%);
        }

        .single-img-wrapper, .dual-img-box {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            margin-bottom: 15px;
            background: #000;
        }

        .dual-img-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .img-wrapper {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            cursor: pointer;
        }

            width: 100%;
